name: Build AyuGram Arabic dylib

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'locales/**'
      - 'tools/**'
      - '.github/workflows/build-dylib.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate embedded Arabic dictionary
        run: python3 tools/build_translations.py
      - name: Compile for iOS arm64
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p dist
          xcrun --sdk iphoneos clang \
            -arch arm64 -miphoneos-version-min=15.0 \
            -isysroot "$SDK" -fobjc-arc -fmodules -O2 \
            -dynamiclib src/AyuGramArabic.m \
            -framework Foundation -framework UIKit \
            -Wl,-install_name,@rpath/AyuGramArabic.dylib \
            -o dist/AyuGramArabic.dylib
          file dist/AyuGramArabic.dylib
          xcrun --sdk iphoneos clang \
            -arch arm64 -miphoneos-version-min=15.0 \
            -isysroot "$SDK" -fobjc-arc -fmodules -O2 \
            -dynamiclib src/AyuGramNotificationBridge.m \
            -framework Foundation -framework Security \
            -Wl,-install_name,@rpath/AyuGramNotificationBridge.dylib \
            -o dist/AyuGramNotificationBridge.dylib
          file dist/AyuGramNotificationBridge.dylib
          shasum -a 256 dist/*.dylib > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AyuGramArabic-iOS15-arm64
          path: dist/
          if-no-files-found: error
